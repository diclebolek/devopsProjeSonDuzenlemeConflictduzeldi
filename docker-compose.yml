services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insucom
      POSTGRES_USER: insucom
      POSTGRES_PASSWORD: insucom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - AZURE_BLOB_BASE_URL=https://insucomstorage.blob.core.windows.net/medya
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://www.insucomsigorta.site/api}
        - NEXT_PUBLIC_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIA_BASE_URL:-https://insucomstorage.blob.core.windows.net/medya}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://www.insucomsigorta.site/api}
      - NEXT_PUBLIC_MEDIA_BASE_URL=${NEXT_PUBLIC_MEDIA_BASE_URL:-https://insucomstorage.blob.core.windows.net/medya}
      - API_INTERNAL_URL=http://backend:8000/api
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata: