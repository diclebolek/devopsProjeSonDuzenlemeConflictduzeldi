services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insucom
      POSTGRES_USER: insucom
      POSTGRES_PASSWORD: insucom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insucom -d insucom"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo_data &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: insucom
      POSTGRES_USER: insucom
      POSTGRES_PASSWORD: insucom
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: docker-dev-not-for-production-use-long-secret-in-real-env-9f1a
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
